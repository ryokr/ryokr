<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" role="img" aria-label="Watch @ryotoiday on YouTube">
  <defs>
    <linearGradient id="ytBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141110" />
      <stop offset="50%" stop-color="#1E130E" />
      <stop offset="100%" stop-color="#28150B" />
    </linearGradient>
    <linearGradient id="ytOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500">
        <animate attributeName="stop-color" values="#FF5500;#FF881A;#FFB84D;#FF5500" dur="5.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FFB84D">
        <animate attributeName="stop-color" values="#FFB84D;#FF5500;#FF881A;#FFB84D" dur="5.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="ytBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFB84D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.85" />
    </linearGradient>
    <clipPath id="ytClip">
      <rect x="2" y="2" width="556" height="176" rx="20" />
    </clipPath>
    <filter id="ytGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#ytClip)">
    <rect x="2" y="2" width="556" height="176" rx="20" fill="url(#ytBg)" />

    <!-- Animated Equalizer Bars -->
    <g transform="translate(382, 148)" opacity="0.3">
      <rect x="0" y="-26" width="6" height="26" rx="3" fill="url(#ytOrange)">
        <animate attributeName="height" values="14;34;18;30;14" dur="2.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="-14;-34;-18;-30;-14" dur="2.1s" repeatCount="indefinite" />
      </rect>
      <rect x="12" y="-36" width="6" height="36" rx="3" fill="url(#ytOrange)">
        <animate attributeName="height" values="30;12;38;18;30" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="-30;-12;-38;-18;-30" dur="1.8s" repeatCount="indefinite" />
      </rect>
      <rect x="24" y="-20" width="6" height="20" rx="3" fill="url(#ytOrange)">
        <animate attributeName="height" values="18;42;14;32;18" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="-18;-42;-14;-32;-18" dur="2.4s" repeatCount="indefinite" />
      </rect>
      <rect x="36" y="-32" width="6" height="32" rx="3" fill="url(#ytOrange)">
        <animate attributeName="height" values="28;16;36;12;28" dur="1.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="-28;-16;-36;-12;-28" dur="1.9s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Pulsing Concentric Play Prism -->
    <g transform="translate(80, 90)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#FF881A" stroke-width="2" opacity="0">
        <animate attributeName="r" values="24;46" dur="2.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#FFB84D" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="24;46" dur="2.6s" begin="1.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;0" dur="2.6s" begin="1.3s" repeatCount="indefinite" />
      </circle>

      <rect x="-28" y="-22" width="56" height="44" rx="13" fill="url(#ytOrange)" filter="url(#ytGlow)">
        <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" />
      </rect>
      <polygon points="-6,-9 11,0 -6,9" fill="#09090B" />
    </g>

    <!-- Minimal Large Outfit Typography -->
    <text x="148" y="84" fill="#FFB84D" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.4">YouTube</text>
    <text x="148" y="122" fill="#FFFFFF" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6">@ryotoiday</text>

    <!-- Play Action Arrow -->
    <g transform="translate(492, 90)">
      <circle cx="0" cy="0" r="22" fill="#FF881A" fill-opacity="0.2" stroke="url(#ytOrange)" stroke-width="1.8" />
      <path d="M-6,0 L6,0 M1,-5 L6,0 L1,5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="-1,0; 2,0; -1,0" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" />
      </path>
    </g>
  </g>

  <rect x="2" y="2" width="556" height="176" rx="20" fill="none" stroke="url(#ytBorder)" stroke-width="2" />
</svg>
